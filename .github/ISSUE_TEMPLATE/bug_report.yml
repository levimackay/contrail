name: Bug report
description: Contrail recorded, graded or printed something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets or private session contents. For a security problem, see SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, and the output (redact anything private).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: contrail doctor
      description: Output of `contrail doctor` (or `/contrail:why` errors). It shows the version, runtime, schema and capture timing.
      render: text
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      placeholder: e.g. 2.1.284
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Other]
