name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle matches source
        run: npm run build && git diff --exit-code plugin/dist/
      - name: Shell scripts
        if: runner.os == 'Linux'
        run: shellcheck plugin/hooks/*.sh plugin/bin/contrail
      - uses: oven-sh/setup-bun@v2
      - name: Runs under Bun
        run: sh plugin/bin/contrail doctor --data "$(mktemp -d)"
