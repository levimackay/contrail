    <text y="421" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Run contrail why &lt;call id&gt;, as in </tspan><tspan x="283.2" fill="#7d8590" font-weight="bold">contrail why t5</tspan><tspan x="400.2">, or contrail why &lt;file&gt;:&lt;line&gt;, for the full trail behind a call.</tspan></text>
    <text y="439" style="white-space: pre"><tspan x="18.0" fill="#7d8590">LIKELY: this call wrote this text to this file, and no later recorded write did [R10]. A text match, so never DIRECT.</tspan></text>
    <text y="457" style="white-space: pre"><tspan x="18.0" fill="#7d8590">POSSIBLE: the file holds the text more often than this call wrote it, or the shell write was expected, not reported.</tspan></text>
    <text y="475" style="white-space: pre"><tspan x="18.0" fill="#7d8590">UNKNOWN: no recorded agent write holds the text. Blank and bracket-only lines join a block only if both sides agree.</tspan></text>
    <text y="493" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Which call last wrote a line is data provenance, not the agent's reasons.</tspan></text>
    <text y="511" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Blind spots: edits outside Claude Code's tools or before Contrail was installed; text redacted or cut when stored.</tspan></text>
    <text y="529" style="white-space: pre"><tspan x="18.0" fill="#7d8590">A Write counts every line it wrote, even unchanged ones. No match is not the same as not written by the agent.</tspan></text>
