    <text y="1087" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Data provenance from Contrail's local record, not a judgment of this change. Not observable: the agent's reasons.</tspan></text>
    <text y="1105" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Blind spots: model knowledge and reasoning; system prompt; AGENTS.md; context injected by other hooks; changes made</tspan></text>
