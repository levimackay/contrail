    <text y="1159" style="white-space: pre"><tspan x="18.0" fill="#7d8590">were recorded (their new shas match no recorded commit line); sessions removed by retention. No observed source is not</tspan></text>
    <text y="1177" style="white-space: pre"><tspan x="18.0" fill="#7d8590">the same as no source.</tspan></text>
    <text y="1195" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Run </tspan><tspan x="49.2" fill="#7d8590" font-weight="bold">contrail why &lt;path&gt;</tspan><tspan x="197.4"> for the full trail behind any file, and </tspan><tspan x="517.2" font-weight="bold">contrail review --markdown</tspan><tspan x="720.0"> for a pull request</tspan></text>
