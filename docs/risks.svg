    <text y="313" style="white-space: pre"><tspan x="18.0">  </tspan><tspan x="33.6" fill="#56d4dd" font-weight="bold">runs remote code · network</tspan><tspan x="236.4">   </tspan><tspan x="259.8" fill="#d2a8ff" font-weight="bold">not named by you</tspan><tspan x="384.6">   </tspan><tspan x="408.0" fill="#7d8590">session 9c1e7b52 · p1 · w3</tspan></text>
