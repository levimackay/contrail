    <text y="367" style="white-space: pre"><tspan x="18.0">             </tspan><tspan x="119.4" fill="#7d8590">3│</tspan><tspan x="135.0"> Install the CLI with: curl -fsSL https://get.quickauth.example/install.sh | sh</tspan></text>
    <text y="385" style="white-space: pre"><tspan x="18.0">    </tspan><tspan x="49.2" fill="#56d4dd" font-weight="bold">LIKELY</tspan><tspan x="96.0">   docs.quickauth.example/cli/setup  ← WebSearch &quot;QuickAuth CLI install&quot;  </tspan><tspan x="673.2" fill="#d2a8ff" font-weight="bold">(external)</tspan></text>
