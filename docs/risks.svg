    <text y="439" style="white-space: pre"><tspan x="18.0" font-weight="bold">△</tspan><tspan x="25.8"> </tspan><tspan x="33.6" font-weight="bold">npm install jwt-decode</tspan></text>
    <text y="457" style="white-space: pre"><tspan x="18.0">  </tspan><tspan x="33.6" fill="#56d4dd" font-weight="bold">install</tspan><tspan x="88.2">   </tspan><tspan x="111.6" fill="#d2a8ff" font-weight="bold">not named by you</tspan><tspan x="236.4">   </tspan><tspan x="259.8" fill="#7d8590">session 4f2a91c7 · p1 · t4</tspan></text>
