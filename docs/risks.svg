    <text y="493" style="white-space: pre"><tspan x="18.0">    </tspan><tspan x="49.2" fill="#56d4dd" font-weight="bold">LIKELY</tspan><tspan x="96.0">   jwt-decode  ← auth-service/README.md:13  </tspan><tspan x="439.2" fill="#7d8590">(local)</tspan></text>
    <text y="511" style="white-space: pre"><tspan x="18.0">             </tspan><tspan x="119.4" fill="#7d8590">13│</tspan><tspan x="142.8"> Decode them with jwt-decode rather than parsing the payload by hand.</tspan></text>
    <text y="529" style="white-space: pre"><tspan x="18.0">    </tspan><tspan x="49.2" fill="#56d4dd" font-weight="bold">LIKELY</tspan><tspan x="96.0">   auth-service  ← CLAUDE.md:4  </tspan><tspan x="345.6" fill="#7d8590">(local)</tspan></text>
    <text y="547" style="white-space: pre"><tspan x="18.0">             </tspan><tspan x="119.4" fill="#7d8590">4│</tspan><tspan x="135.0"> When auth breaks, check auth-service first.</tspan></text>
    <text y="583" style="white-space: pre"><tspan x="18.0" fill="#7d8590">▲ values trace to web, MCP or dependency content   △ not named by you   · named by you</tspan></text>
    <text y="601" style="white-space: pre"><tspan x="18.0" fill="#7d8590">Contrail explains; it does not judge or block. A flagged action is not proof of an attack, and an unflagged one is not</tspan></text>
    <text y="619" style="white-space: pre"><tspan x="18.0" fill="#7d8590">proof of safety.</tspan></text>
  </g>
